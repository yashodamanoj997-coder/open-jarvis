name: Build OpenJarvis APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Build APK
        run: |
          chmod +x gradlew      - name: Build APK
        run: |
          set +e
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Show compiler errors
        if: failure()
        run: |
          grep -n -E '(^e: |error:|Unresolved reference|Type mismatch|Overload resolution ambiguity)' build.log | head -80 || tail -n 100 build.log
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenJarvis-debug-APK
          path: app/build/outputs/apk/debug/*.apk
