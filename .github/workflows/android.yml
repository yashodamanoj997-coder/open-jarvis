name: Build OpenJarvis APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Build APK and print Kotlin errors
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
          result=${PIPESTATUS[0]}
          echo "========== KOTLIN COMPILER ERRORS =========="
          grep -n -E '(^e: |\.kt:[0-9]+:[0-9]+: error:)' build.log || true
          echo "========== END KOTLIN ERRORS ==============="
          exit "$result"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenJarvis-build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenJarvis-debug-APK
          path: app/build/outputs/apk/debug/*.apk
